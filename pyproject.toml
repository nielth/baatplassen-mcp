[project]
name = "baatplassen"
version = "0.1.0"
description = "Personal searchable archive of the baatplassen.no forum, exposed to Claude over MCP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "lxml>=5.0",
    "mcp>=2.3",
    "pillow>=13.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
baatplassen = "baatplassen.cli:main"

[dependency-groups]
dev = [
    "black>=24.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.5",
    "types-beautifulsoup4>=4.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/baatplassen"]

[tool.mypy]
strict = true
