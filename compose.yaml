# baatplassen-mcp serves the archive to the Claude connector, through the Caddy on the
# external `public-caddy` network. baatplassen-crawler finishes the download and then looks
# for new posts every 24 hours. Both use the same data folder.
#
# Needs BAATPLASSEN_MCP_SECRET in .env. The server only answers on /<secret>/mcp, and on
# /<secret>/notes, the page for adding photos to the boat log. This is the admin's secret, which
# can give other people their own on the notes page:
#   echo "BAATPLASSEN_MCP_SECRET=$(openssl rand -hex 32)" > .env && chmod 600 .env
#
# Set BAATPLASSEN_DATA_DIR to keep the data somewhere other than ./data.

x-hardening: &hardening
  # Built here, never pulled: this image isn't in any registry.
  image: baatplassen:latest
  build: .
  pull_policy: build
  restart: unless-stopped
  user: "1000:1000"
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  volumes:
    # Writable: SQLite needs its WAL files here, viewed images are cached here and the boat
    # log is kept here.
    - ${BAATPLASSEN_DATA_DIR:-./data}:/data
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  baatplassen-mcp:
    <<: *hardening
    container_name: baatplassen-mcp
    environment:
      BAATPLASSEN_DB: /data/baatplassen.db
      BAATPLASSEN_MCP_SECRET: ${BAATPLASSEN_MCP_SECRET:?Set BAATPLASSEN_MCP_SECRET in .env}
    networks:
      - public-caddy

  baatplassen-crawler:
    <<: *hardening
    container_name: baatplassen-crawler
    command: ["/baatplassen", "run", "--delay", "0.25"]
    environment:
      BAATPLASSEN_DB: /data/baatplassen.db
    depends_on:
      - baatplassen-mcp
    # Not on public-caddy: the crawler only needs outbound internet access.
    networks:
      - crawler

networks:
  public-caddy:
    external: true
  crawler:
